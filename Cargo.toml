[package]
description = "Cloud-native OIDC: Kubernetes operator syncing OIDC applications and roles to a Zitadel project via zapp"
edition = "2024"
license = "AGPL-3.0-or-later"
name = "cnoidc"
repository = "https://github.com/famedly/cnoidc"
version = "0.1.0"

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
famedly-zitadel-rust-client = "0.14"
futures = "0.3"
humantime = "2"
humantime-serde = "1"
k8s-openapi = { version = "0.28", features = ["v1_33", "schemars"] }
kube = { version = "4", default-features = false, features = [
  "client",
  "rustls-tls",
  "aws-lc-rs",
  "runtime",
  "derive",
] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
reqwest-middleware = "0.5"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
wiremock = "0.6"
