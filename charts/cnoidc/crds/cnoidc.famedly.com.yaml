---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: oidcapplications.cnoidc.famedly.com
spec:
  group: cnoidc.famedly.com
  names:
    kind: OIDCApplication
    plural: oidcapplications
    shortNames:
    - oidcapp
    singular: oidcapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.clientId
      name: Client ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: An OIDC application in the cluster's Zitadel project
        properties:
          spec:
            description: |-
              An OIDC application in the cluster's Zitadel project.

              The operator creates (or adopts, by name) the application in Zitadel,
              keeps its configuration in sync with this spec and publishes the client
              ID, project ID and Zitadel URL in a ConfigMap next to the resource. For
              confidential clients (`authMethod: basic` or `post`) the client secret is
              placed in a Secret.
            properties:
              accessTokenRoleAssertion:
                default: false
                description: Put the user's project roles into the access token.
                type: boolean
              accessTokenType:
                default: bearer
                description: Format of the access tokens issued to this client.
                enum:
                - bearer
                - jwt
                type: string
              additionalOrigins:
                default: []
                description: |-
                  Additional origins (scheme://host[:port]) allowed for CORS, on top of
                  those derived from the redirect URIs.
                items:
                  type: string
                type: array
              appType:
                default: web
                description: |-
                  Kind of client: `web` (server-side, may hold a secret), `userAgent`
                  (browser SPA) or `native` (mobile/desktop).
                enum:
                - web
                - userAgent
                - native
                type: string
              authMethod:
                default: none
                description: |-
                  How the client authenticates at the token endpoint. `none` means
                  public client with PKCE (the default); `basic` and `post` get a client
                  secret, `privateKeyJwt` uses a key registered on the application.
                enum:
                - none
                - basic
                - post
                - privateKeyJwt
                type: string
              backChannelLogoutUri:
                description: URI Zitadel calls for back-channel logout.
                nullable: true
                type: string
              clockSkew:
                description: |-
                  Clock skew tolerated when validating tokens, e.g. `5s`. Zitadel allows
                  at most `5s`.
                nullable: true
                type: string
              configMapName:
                description: |-
                  Name of the ConfigMap the operator writes the client ID and related
                  settings to. Defaults to `<name>-oidc`.
                nullable: true
                type: string
              devMode:
                default: false
                description: |-
                  Allow `http://` redirect URIs and skip other production checks. Only
                  for development.
                type: boolean
              grantTypes:
                default:
                - authorizationCode
                description: |-
                  OAuth 2.0 grant types the client may use. Defaults to
                  `[authorizationCode]`.
                items:
                  enum:
                  - authorizationCode
                  - implicit
                  - refreshToken
                  - deviceCode
                  - tokenExchange
                  type: string
                type: array
              idTokenRoleAssertion:
                default: false
                description: Put the user's project roles into the ID token.
                type: boolean
              idTokenUserinfoAssertion:
                default: false
                description: Put the user info claims (profile, email, ...) into the ID token.
                type: boolean
              postLogoutRedirectUris:
                default: []
                description: Allowed redirect URIs after logout.
                items:
                  type: string
                type: array
              redirectUris:
                default: []
                description: Allowed redirect URIs after login.
                items:
                  type: string
                type: array
              responseTypes:
                default:
                - code
                description: OAuth 2.0 response types the client may request. Defaults to `[code]`.
                items:
                  enum:
                  - code
                  - idToken
                  - idTokenToken
                  type: string
                type: array
              secretName:
                description: |-
                  Name of the Secret the client secret is written to, for `authMethod:
                  basic` or `post`. Defaults to `<name>-oidc`.
                nullable: true
                type: string
              skipNativeAppSuccessPage:
                default: false
                description: Skip the success page shown to native apps after login.
                type: boolean
            type: object
          status:
            nullable: true
            properties:
              applicationId:
                description: ID of the application in Zitadel.
                nullable: true
                type: string
              clientId:
                description: OIDC client ID assigned by Zitadel.
                nullable: true
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              configMap:
                description: Name of the ConfigMap the settings were written to.
                nullable: true
                type: string
              observedGeneration:
                description: Generation of the spec the status reflects.
                format: int64
                nullable: true
                type: integer
              projectId:
                description: ID of the Zitadel project the application lives in.
                nullable: true
                type: string
              secret:
                description: Name of the Secret holding the client secret, if any.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: OIDCApplication
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projectroles.cnoidc.famedly.com
spec:
  group: cnoidc.famedly.com
  names:
    kind: ProjectRole
    plural: projectroles
    shortNames:
    - zrole
    singular: projectrole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.key
      name: Key
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A role in the cluster's Zitadel project
        properties:
          spec:
            description: |-
              A role in the cluster's Zitadel project.

              Zitadel identifies roles by their key; the operator creates the role and
              publishes the key together with the project ID, Zitadel URL and the name
              of the token claim carrying project roles in a ConfigMap. Keys must be
              unique across the cluster.
            properties:
              configMapName:
                description: |-
                  Name of the ConfigMap the operator writes the role key and related
                  settings to. Defaults to `<name>-role`.
                nullable: true
                type: string
              displayName:
                description: Human-readable name shown in the Zitadel console. Defaults to the key.
                nullable: true
                type: string
              group:
                description: Optional group the role is sorted into in the console.
                nullable: true
                type: string
              key:
                description: |-
                  Role key, the identifier Zitadel puts into tokens. Defaults to the
                  resource name. Immutable once the role exists.
                nullable: true
                type: string
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              configMap:
                description: Name of the ConfigMap the settings were written to.
                nullable: true
                type: string
              key:
                description: Key of the role in Zitadel.
                nullable: true
                type: string
              observedGeneration:
                description: Generation of the spec the status reflects.
                format: int64
                nullable: true
                type: integer
              projectId:
                description: ID of the Zitadel project the role belongs to.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: ProjectRole
        type: object
    served: true
    storage: true
    subresources:
      status: {}
