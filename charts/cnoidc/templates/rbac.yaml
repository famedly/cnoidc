{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cnoidc.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.rbac.create }}
{{- if .Values.watchNamespace }}
---
# Restricted to a single namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cnoidc.fullname" . }}
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
rules:
  {{- include "cnoidc.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cnoidc.fullname" . }}
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cnoidc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cnoidc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cnoidc.fullname" . }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
rules:
  {{- include "cnoidc.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cnoidc.fullname" . }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cnoidc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cnoidc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
