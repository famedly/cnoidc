apiVersion: v1
kind: Service
metadata:
  name: {{ include "cnoidc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cnoidc.selectorLabels" . | nindent 4 }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cnoidc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "cnoidc.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /healthz
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cnoidc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cnoidc.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cnoidc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnoidc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cnoidc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
        - port: 6443
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
